let th=-0.55,ph=0.88,rad=17,tg=new THREE.Vector3(0,0,0.6);
function upd(){C.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));C.lookAt(tg);}
function setView(v){if(v==='iso'){th=-0.55;ph=0.88;rad=17;tg.set(0,0,0.6);}if(v==='top'){th=0;ph=0.02;rad=18;tg.set(0,0,0.6);}if(v==='door'){th=0;ph=1.42;rad=4.2;tg.set(px(430),1.25,pz(540));}if(v==='left'){th=0.85;ph=1.15;rad=5.6;tg.set(px(130),1.0,pz(590));}if(v==='right'){th=-1.25;ph=1.15;rad=6.6;tg.set(px(780),1.0,pz(460));}if(v==='counter'){th=0.15;ph=1.2;rad=4.5;tg.set(px(410),1.1,pz(410));}upd();}
function toggleFlow(){flow.visible=!flow.visible;document.getElementById('fb').textContent=flow.visible?'동선 숨기기':'동선 보기';}
function toggleLabels(){const v=!labels[0].visible;labels.forEach(l=>l.visible=v);document.getElementById('lb').textContent=v?'이름표 숨기기':'이름표 보기';}
function savePng(){R.render(S,C);const a=document.createElement('a');a.href=R.domElement.toDataURL('image/png');a.download='니트베이커리_3D평면도_최종.png';a.click();}
let dr=false,lx=0,ly=0;
W.addEventListener('pointerdown',e=>{dr=true;lx=e.clientX;ly=e.clientY;W.setPointerCapture(e.pointerId);W.style.cursor='grabbing';});
W.addEventListener('pointerup',()=>{dr=false;W.style.cursor='grab';});
W.addEventListener('pointermove',e=>{if(!dr)return;th-=(e.clientX-lx)*0.008;ph=Math.min(1.5,Math.max(0.02,ph-(e.clientY-ly)*0.006));lx=e.clientX;ly=e.clientY;upd();});
W.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(30,Math.max(2.5,rad*(1+e.deltaY*0.001)));upd();},{passive:false});
addEventListener('resize',()=>{R.setSize(W.clientWidth,H());C.aspect=W.clientWidth/H();C.updateProjectionMatrix();});
setView('iso');
(function loop(){R.render(S,C);requestAnimationFrame(loop);})();
</script></body></html>
